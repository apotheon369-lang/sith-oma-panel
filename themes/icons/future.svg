<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="252" height="252" rx="56"/>
    </clipPath>
    <radialGradient id="cyberGlow" cx="50%" cy="44%" r="54%">
      <stop offset="0%" stop-color="#18d8ff" stop-opacity="0.28"/>
      <stop offset="48%" stop-color="#ff2fa8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000406" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titaniumArmor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#112430"/>
      <stop offset="50%" stop-color="#07121a"/>
      <stop offset="100%" stop-color="#000406"/>
    </linearGradient>
    <linearGradient id="titaniumHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163140"/>
      <stop offset="52%" stop-color="#091620"/>
      <stop offset="100%" stop-color="#030a0f"/>
    </linearGradient>
    <linearGradient id="cyanRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ceeff"/>
      <stop offset="55%" stop-color="#18d8ff"/>
      <stop offset="100%" stop-color="#0c7ea3"/>
    </linearGradient>
    <linearGradient id="rimOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18d8ff"/>
      <stop offset="50%" stop-color="#9ceeff"/>
      <stop offset="100%" stop-color="#ff2fa8"/>
    </linearGradient>
    <linearGradient id="visorCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#18d8ff"/>
      <stop offset="50%" stop-color="#9ceeff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="254" height="254" rx="56" fill="#000406"/>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#000406"/>
    <rect width="256" height="256" fill="url(#cyberGlow)"/>

    <!-- Background Tactical Hex Ring & Circuit Traces -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="128,28 206,73 206,163 128,208 50,163 50,73" stroke="#18d8ff" stroke-width="1.3" opacity="0.28"/>
      <polygon points="128,38 197,78 197,158 128,198 59,158 59,78" stroke="#ff2fa8" stroke-width="1.1" opacity="0.24"/>

      <!-- Left circuit traces -->
      <path d="M18 76 L46 76 L60 90 L76 90" stroke="#18d8ff" stroke-width="1.8" opacity="0.65"/>
      <path d="M16 116 L44 116 L58 104" stroke="#9ceeff" stroke-width="1.4" opacity="0.5"/>
      <path d="M22 158 L50 158 L66 144" stroke="#ff2fa8" stroke-width="1.6" opacity="0.65"/>

      <!-- Right circuit traces -->
      <path d="M238 76 L210 76 L196 90 L180 90" stroke="#18d8ff" stroke-width="1.8" opacity="0.65"/>
      <path d="M240 116 L212 116 L198 104" stroke="#9ceeff" stroke-width="1.4" opacity="0.5"/>
      <path d="M234 158 L206 158 L190 144" stroke="#ff2fa8" stroke-width="1.6" opacity="0.65"/>
    </g>

    <!-- Circuit nodes -->
    <g>
      <circle cx="46" cy="76" r="2.8" fill="#18d8ff"/>
      <circle cx="210" cy="76" r="2.8" fill="#18d8ff"/>
      <circle cx="44" cy="116" r="2.4" fill="#9ceeff"/>
      <circle cx="212" cy="116" r="2.4" fill="#9ceeff"/>
      <circle cx="50" cy="158" r="2.8" fill="#ff2fa8"/>
      <circle cx="206" cy="158" r="2.8" fill="#ff2fa8"/>
    </g>

    <!-- Cyber Titanium Shoulders & Chest Core -->
    <path d="M30 256 L46 208 L80 186 L104 174 L152 174 L176 186 L210 208 L226 256 Z" fill="url(#titaniumArmor)"/>
    <path d="M32 256 L46 208 L80 186 L104 174" fill="none" stroke="#18d8ff" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M224 256 L210 208 L176 186 L152 174" fill="none" stroke="#9ceeff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M72 204 L98 220 L108 256" fill="none" stroke="#18d8ff" stroke-width="1.5" opacity="0.6"/>
    <path d="M184 204 L158 220 L148 256" fill="none" stroke="#ff2fa8" stroke-width="1.5" opacity="0.65"/>

    <!-- Chest Hex Reactor -->
    <polygon points="128,196 144,205 144,225 128,234 112,225 112,205" fill="#000406" stroke="#18d8ff" stroke-width="2"/>
    <polygon points="128,203 137,209 137,221 128,227 119,221 119,209" fill="#ff2fa8" opacity="0.88"/>
    <polygon points="128,208 133,211 133,219 128,222 123,219 123,211" fill="#9ceeff"/>

    <!-- Iconic Ultron Flared Temple Ear Fins -->
    <path d="M84 128 L64 108 L66 72 L86 92 Z" fill="url(#titaniumHead)" stroke="#18d8ff" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M70 84 L82 98 L82 118" fill="none" stroke="#9ceeff" stroke-width="1.4" opacity="0.78"/>
    <path d="M172 128 L192 108 L190 72 L170 92 Z" fill="url(#titaniumHead)" stroke="#9ceeff" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M186 84 L174 98 L174 118" fill="none" stroke="#ff2fa8" stroke-width="1.4" opacity="0.78"/>

    <!-- Sleek Cyber Titanium Cranium -->
    <path d="M84 102 C84 62 104 42 128 42 C152 42 172 62 172 102 L168 140 L154 174 L128 184 L102 174 L88 140 Z" fill="url(#titaniumHead)"/>
    <path d="M84 102 C84 62 104 42 128 42 C152 42 172 62 172 102" fill="none" stroke="url(#cyanRim)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M84 102 L88 140 L102 174 L128 184" fill="none" stroke="#18d8ff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M172 102 L168 140 L154 174 L128 184" fill="none" stroke="#9ceeff" stroke-width="2.3" stroke-linejoin="round"/>

    <!-- Titanium Seam Traces on Cranium -->
    <path d="M104 56 L108 86 L92 102" fill="none" stroke="#18d8ff" stroke-width="1.4" opacity="0.65" stroke-linejoin="round"/>
    <path d="M152 56 L148 86 L164 102" fill="none" stroke="#ff2fa8" stroke-width="1.4" opacity="0.65" stroke-linejoin="round"/>

    <!-- Forehead Hex-Crest -->
    <polygon points="128,55 142,63 142,79 128,87 114,79 114,63" fill="#000406" stroke="#18d8ff" stroke-width="2.1"/>
    <polygon points="128,61 136,66 136,76 128,81 120,76 120,66" fill="#ff2fa8" stroke="#9ceeff" stroke-width="1.1"/>
    <circle cx="128" cy="71" r="2.8" fill="#ffffff"/>

    <!-- Armored Brow Visor -->
    <path d="M84 102 L114 113 L128 106 L142 113 L172 102 L166 115 L142 121 L128 116 L114 121 L90 115 Z" fill="#040b10" stroke="#9ceeff" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Glowing Cyan Visor Optics -->
    <polygon points="94,117 118,123 114,130 95,125" fill="#18d8ff" opacity="0.45"/>
    <polygon points="96,118 116,123 113,128 97,124" fill="url(#visorCyan)"/>
    <polygon points="162,117 138,123 142,130 161,125" fill="#18d8ff" opacity="0.45"/>
    <polygon points="160,118 140,123 143,128 159,124" fill="url(#visorCyan)"/>

    <!-- Cheek Armor Angles -->
    <path d="M90 132 L106 142 L104 162" fill="none" stroke="#18d8ff" stroke-width="1.5" opacity="0.72" stroke-linejoin="round"/>
    <path d="M166 132 L150 142 L152 162" fill="none" stroke="#9ceeff" stroke-width="1.5" opacity="0.72" stroke-linejoin="round"/>

    <!-- Iconic Ultron Mechanical Jaw Grille -->
    <path d="M100 145 L116 150 L140 150 L156 145 L151 165 L138 171 L118 171 L105 165 Z" fill="#000406" stroke="#18d8ff" stroke-width="2" stroke-linejoin="round"/>
    <g stroke-linecap="round">
      <line x1="110" y1="151" x2="112" y2="165" stroke="#18d8ff" stroke-width="2.2"/>
      <line x1="119" y1="153" x2="120" y2="168" stroke="#9ceeff" stroke-width="2.2"/>
      <line x1="128" y1="153" x2="128" y2="169" stroke="#ff2fa8" stroke-width="2.4"/>
      <line x1="137" y1="153" x2="136" y2="168" stroke="#9ceeff" stroke-width="2.2"/>
      <line x1="146" y1="151" x2="144" y2="165" stroke="#18d8ff" stroke-width="2.2"/>
    </g>
  </g>

  <rect x="2.5" y="2.5" width="251" height="251" rx="54.5" fill="none" stroke="url(#rimOuter)" stroke-width="3"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="49.5" fill="none" stroke="#18d8ff" stroke-width="1.3" opacity="0.75"/>
</svg>
