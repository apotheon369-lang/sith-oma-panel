<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="252" height="252" rx="56"/>
    </clipPath>
    <radialGradient id="gammaAura" cx="50%" cy="54%" r="54%">
      <stop offset="0%" stop-color="#2bff4a" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#9b30ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#030804" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hulkSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#194f22"/>
      <stop offset="56%" stop-color="#09210d"/>
      <stop offset="100%" stop-color="#030804"/>
    </linearGradient>
    <linearGradient id="fistPlate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bff4a"/>
      <stop offset="45%" stop-color="#11541e"/>
      <stop offset="100%" stop-color="#051a09"/>
    </linearGradient>
    <linearGradient id="gammaRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8ff2e"/>
      <stop offset="50%" stop-color="#2bff4a"/>
      <stop offset="100%" stop-color="#9b30ff"/>
    </linearGradient>
    <linearGradient id="eyeGamma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2bff4a"/>
      <stop offset="50%" stop-color="#c8ff2e"/>
      <stop offset="100%" stop-color="#f7ffbd"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="254" height="254" rx="56" fill="#030804"/>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#030804"/>
    <rect width="256" height="256" fill="url(#gammaAura)"/>

    <!-- Bruised-Purple Fracture Shockwaves -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="128" cy="138" r="90" stroke="#9b30ff" stroke-width="4.5" stroke-dasharray="24 10" opacity="0.48"/>
      <circle cx="128" cy="138" r="74" stroke="#2bff4a" stroke-width="1.6" stroke-dasharray="16 10" opacity="0.46"/>

      <!-- Jagged fracture shockwave bolts -->
      <path d="M20 44 L58 74 L44 90 L76 106" stroke="#9b30ff" stroke-width="3.2" opacity="0.88"/>
      <path d="M236 44 L198 74 L212 90 L180 106" stroke="#9b30ff" stroke-width="3.2" opacity="0.88"/>
      <path d="M18 144 L54 146 L42 162 L78 164" stroke="#9b30ff" stroke-width="2.6" opacity="0.78"/>
      <path d="M238 144 L202 146 L214 162 L178 164" stroke="#9b30ff" stroke-width="2.6" opacity="0.78"/>
      <path d="M24 216 L60 192 L50 176 L82 168" stroke="#c8ff2e" stroke-width="2.6" opacity="0.8"/>
      <path d="M232 216 L196 192 L206 176 L174 168" stroke="#c8ff2e" stroke-width="2.6" opacity="0.8"/>
      <path d="M128 16 L121 34 L133 42" stroke="#9b30ff" stroke-width="2.6" opacity="0.86"/>
    </g>

    <!-- Colossal Hulk Traps & Shoulders -->
    <path d="M22 256 L36 198 L72 166 L96 154 L160 154 L184 166 L220 198 L234 256 Z" fill="url(#hulkSkin)"/>
    <path d="M24 256 L36 198 L72 166" fill="none" stroke="#2bff4a" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M232 256 L220 198 L184 166" fill="none" stroke="#c8ff2e" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Brutalist Hulk Head & Heavy Brow Crest -->
    <path d="M84 82 L80 120 L92 152 L114 166 L142 166 L164 152 L176 120 L172 82 L156 54 L100 54 Z" fill="url(#hulkSkin)" stroke="#2bff4a" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- Jagged Brutalist Hair Silhouette -->
    <path d="M82 86 L74 62 L94 60 L102 36 L120 50 L134 32 L146 50 L166 40 L164 62 L182 68 L172 88 L154 72 L128 66 L102 72 Z" fill="#061408" stroke="#c8ff2e" stroke-width="2.1" stroke-linejoin="round"/>

    <!-- Heavy Furrowed Brow Ridge -->
    <path d="M84 88 L118 99 L128 91 L138 99 L172 88 L167 103 L138 109 L128 102 L118 109 L89 103 Z" fill="#0d2e13" stroke="#2bff4a" stroke-width="2.3" stroke-linejoin="round"/>
    <path d="M119 82 L128 93 L137 82" fill="none" stroke="#c8ff2e" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Radioactive Lime Eyes -->
    <polygon points="94,104 119,112 114,120 95,114" fill="#2bff4a" opacity="0.48"/>
    <polygon points="96,106 117,112 113,117 97,113" fill="url(#eyeGamma)"/>
    <polygon points="162,104 137,112 142,120 161,114" fill="#2bff4a" opacity="0.48"/>
    <polygon points="160,106 139,112 143,117 159,113" fill="url(#eyeGamma)"/>

    <!-- Nose & Brutalist Cheek Cuts -->
    <path d="M128 110 L122 126 L128 129 L134 126 Z" fill="#030804" stroke="#2bff4a" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M90 124 L106 132" stroke="#c8ff2e" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
    <path d="M166 124 L150 132" stroke="#c8ff2e" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>

    <!-- Snarling Grit Jaw (Clearly Visible Above Fist) -->
    <path d="M100 136 L128 133 L156 136 L151 151 L128 154 L105 151 Z" fill="#030804" stroke="#2bff4a" stroke-width="1.9" stroke-linejoin="round"/>
    <path d="M107 143 L149 143" stroke="#030804" stroke-width="1.8"/>
    <polygon points="107,138 149,138 146,149 110,149" fill="#e9ffed"/>
    <path d="M107 143.5 L149 143.5" stroke="#030804" stroke-width="1.6"/>
    <g stroke="#030804" stroke-width="1.5">
      <line x1="115" y1="138" x2="115" y2="149"/>
      <line x1="122" y1="138" x2="122" y2="149"/>
      <line x1="128" y1="138" x2="128" y2="149"/>
      <line x1="134" y1="138" x2="134" y2="149"/>
      <line x1="141" y1="138" x2="141" y2="149"/>
    </g>

    <!-- Bruised-Purple Impact Shockwave Halo Behind Fist -->
    <path d="M64 214 L78 196 L68 176 L94 176 L104 158 L128 168 L152 158 L162 176 L188 176 L178 196 L192 214" fill="none" stroke="#9b30ff" stroke-width="3.2" stroke-linejoin="round" opacity="0.9"/>

    <!-- Foreground Brutalist Gamma Smash Fist Crest -->
    <path d="M90 218 L86 192 C86 184 92 180 100 181 L104 182 L105 176 C106 169 113 166 121 168 L125 169 L128 164 C131 159 139 159 144 164 L148 170 C155 168 163 172 165 180 L168 189 C175 191 178 198 176 206 L170 228 L153 239 L153 254 L103 254 L103 239 Z" fill="url(#fistPlate)" stroke="#c8ff2e" stroke-width="2.7" stroke-linejoin="round"/>
    <path d="M104 182 L106 208 M125 169 L125 206 M146 170 L143 208 M167 189 L161 212" stroke="#030804" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M92 212 C108 202 148 202 166 214" fill="none" stroke="#c8ff2e" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Thumb Crest -->
    <path d="M86 210 L107 204 C115 202 121 209 119 217 L113 230 C108 237 95 237 88 228 Z" fill="#2bff4a" stroke="#030804" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Bruised-Purple Gauntlet Fracture Bar -->
    <rect x="102" y="237" width="52" height="14" rx="4" fill="#9b30ff" stroke="#c8ff2e" stroke-width="1.9"/>
    <polygon points="128,239 133,244 128,249 123,244" fill="#c8ff2e"/>
  </g>

  <rect x="2.5" y="2.5" width="251" height="251" rx="54.5" fill="none" stroke="url(#gammaRim)" stroke-width="3"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="49.5" fill="none" stroke="#9b30ff" stroke-width="1.4" opacity="0.82"/>
</svg>
