<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="252" height="252" rx="56"/>
    </clipPath>
    <radialGradient id="limeVortexGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#1aff5c" stop-opacity="0.34"/>
      <stop offset="50%" stop-color="#0b4018" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#010803" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suitGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#143809"/>
      <stop offset="58%" stop-color="#071905"/>
      <stop offset="100%" stop-color="#010803"/>
    </linearGradient>
    <linearGradient id="maskSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d3b18"/>
      <stop offset="55%" stop-color="#051c0a"/>
      <stop offset="100%" stop-color="#020c04"/>
    </linearGradient>
    <linearGradient id="fedoraGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe135"/>
      <stop offset="45%" stop-color="#614e04"/>
      <stop offset="100%" stop-color="#1f1801"/>
    </linearGradient>
    <linearGradient id="grinTeeth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2fff5"/>
      <stop offset="60%" stop-color="#c6ff3d"/>
      <stop offset="100%" stop-color="#1aff5c"/>
    </linearGradient>
    <linearGradient id="rimOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1aff5c"/>
      <stop offset="50%" stop-color="#c6ff3d"/>
      <stop offset="100%" stop-color="#ffe135"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="254" height="254" rx="56" fill="#010803"/>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#010803"/>
    <rect width="256" height="256" fill="url(#limeVortexGlow)"/>

    <!-- Dynamic Lime Whirlwind Vortex -->
    <g fill="none" stroke-linecap="round">
      <path d="M40 162 C26 112 52 54 114 40 C176 28 226 68 224 128 C222 184 176 220 120 218" stroke="#1aff5c" stroke-width="2.6" opacity="0.46"/>
      <path d="M214 96 C230 144 202 198 142 208 C84 218 42 178 46 124 C50 74 96 44 150 48" stroke="#c6ff3d" stroke-width="2" opacity="0.52"/>
      <path d="M62 148 C58 106 86 68 134 66 C180 64 206 100 196 144" stroke="#ffe135" stroke-width="1.7" opacity="0.48"/>
      <path d="M36 92 C58 58 96 42 138 42" stroke="#1aff5c" stroke-width="3.8" opacity="0.22"/>
      <path d="M216 168 C196 202 154 222 108 218" stroke="#c6ff3d" stroke-width="3.6" opacity="0.22"/>
    </g>

    <!-- Vortex Star Sparks -->
    <path d="M42 66 L44 72 L50 74 L44 76 L42 82 L40 76 L34 74 L40 72 Z" fill="#ffe135" opacity="0.9"/>
    <path d="M216 144 L218 149 L223 151 L218 153 L216 158 L214 153 L209 151 L214 149 Z" fill="#c6ff3d" opacity="0.88"/>
    <circle cx="206" cy="56" r="1.8" fill="#1aff5c" opacity="0.85"/>
    <circle cx="44" cy="186" r="1.8" fill="#ffe135" opacity="0.85"/>

    <!-- Zoot Suit Shoulders & Sharp Lapels -->
    <path d="M30 256 L46 212 L82 192 L106 176 L128 220 L150 176 L174 192 L210 212 L226 256 Z" fill="url(#suitGrad)"/>
    <path d="M32 256 L46 212 L82 192 L106 176" fill="none" stroke="#1aff5c" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M224 256 L210 212 L174 192 L150 176" fill="none" stroke="#ffe135" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M106 176 L88 206 L128 242 L168 206 L150 176" fill="none" stroke="#c6ff3d" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="128,194 136,214 128,254 120,214" fill="#ffe135" stroke="#010803" stroke-width="1.5"/>

    <!-- Emerald Mask Face Silhouette -->
    <path d="M88 102 L86 138 C88 164 106 184 128 186 C150 184 168 164 170 138 L168 102 Z" fill="url(#maskSkin)"/>
    <path d="M88 108 L86 138 C88 164 106 184 128 186 C150 184 168 164 170 138 L168 108" fill="none" stroke="#1aff5c" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- Sculpted Cheek Highlights & Nose -->
    <path d="M94 130 C100 124 110 126 114 132" fill="none" stroke="#c6ff3d" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M162 130 C156 124 146 126 142 132" fill="none" stroke="#c6ff3d" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M128 118 L124 132 L133 134" fill="none" stroke="#1aff5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- Mischievous Glowing Eyes Under Brim -->
    <path d="M95 116 C103 111 113 113 118 120 C110 123 101 122 95 116 Z" fill="#c6ff3d"/>
    <circle cx="107" cy="117" r="2.2" fill="#010803"/>
    <path d="M161 116 C153 111 143 113 138 120 C146 123 155 122 161 116 Z" fill="#ffe135"/>
    <circle cx="149" cy="117" r="2.2" fill="#010803"/>

    <!-- Huge Sculpted Emerald Grin -->
    <path d="M91 138 C110 154 146 154 165 138 C163 166 146 176 128 176 C110 176 93 166 91 138 Z" fill="url(#grinTeeth)" stroke="#1aff5c" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M96 151 Q128 164 160 151" fill="none" stroke="#03260b" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#03260b" stroke-width="1.7" stroke-linecap="round">
      <line x1="106" y1="145" x2="104" y2="165"/>
      <line x1="117" y1="148" x2="116" y2="171"/>
      <line x1="128" y1="149" x2="128" y2="173"/>
      <line x1="139" y1="148" x2="140" y2="171"/>
      <line x1="150" y1="145" x2="152" y2="165"/>
    </g>

    <!-- Iconic Gold Fedora Silhouette (Jaunty Tilt) -->
    <g transform="rotate(-7 128 84)">
      <!-- Fedora Crown -->
      <path d="M84 92 L95 45 C107 38 119 46 128 46 C137 46 149 38 161 45 L172 92 Z" fill="url(#fedoraGold)" stroke="#ffe135" stroke-width="2.6" stroke-linejoin="round"/>
      <!-- Neon Emerald Hatband -->
      <path d="M86 82 Q128 88 170 82 L172 91 Q128 97 84 91 Z" fill="#1aff5c" stroke="#010803" stroke-width="1.3"/>
      <!-- Sweeping Fedora Brim -->
      <path d="M48 98 C86 82 170 82 208 98 C176 112 80 112 48 98 Z" fill="url(#fedoraGold)" stroke="#ffe135" stroke-width="2.7" stroke-linejoin="round"/>
      <path d="M58 98 C92 106 164 106 198 98" fill="none" stroke="#c6ff3d" stroke-width="1.6" stroke-linecap="round" opacity="0.82"/>
    </g>
  </g>

  <rect x="2.5" y="2.5" width="251" height="251" rx="54.5" fill="none" stroke="url(#rimOuter)" stroke-width="3"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="49.5" fill="none" stroke="#1aff5c" stroke-width="1.3" opacity="0.72"/>
</svg>
