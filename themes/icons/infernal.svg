    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <circle cx="128" cy="118" r="85" stroke="#ff1e3c" stroke-width="4" opacity="0.16"/>
      <circle cx="128" cy="118" r="85" stroke="#ff8596" stroke-width="1.3" opacity="0.52"/>
      <circle cx="128" cy="118" r="76" stroke="#ff1e3c" stroke-width="2" opacity="0.45"/>
      <polygon points="128,194 83.3,56.5 200.3,141.5 55.7,141.5 172.7,56.5" stroke="#ff1e3c" stroke-width="4.5" opacity="0.18"/>
      <polygon points="128,194 83.3,56.5 200.3,141.5 55.7,141.5 172.7,56.5" stroke="#ff8596" stroke-width="1.4" opacity="0.62"/>
    </g>

