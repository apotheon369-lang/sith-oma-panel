    <path d="M88 94 L83 122 L90 152 L114 180 L128 188 L142 180 L166 152 L173 122 L168 94 L148 76 L108 76 Z" fill="url(#visageFill)"/>
    <path d="M88 94 L83 122 L90 152 L114 180 L128 188 L142 180 L166 152 L173 122 L168 94" fill="none" stroke="url(#crimsonRim)" stroke-width="2.7" stroke-linejoin="round"/>

