    <path d="M100 94 C72 88 50 64 56 26 C67 48 84 68 112 80" fill="none" stroke="#ff8596" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M76 76 C68 64 63 52 60 39" fill="none" stroke="#ff1e3c" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

    <path d="M156 94 C184 88 206 64 200 26 C189 48 172 68 144 80 Z" fill="url(#hornGrad)"/>
    <path d="M156 94 C184 88 206 64 200 26 C189 48 172 68 144 80" fill="none" stroke="#ff8596" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M180 76 C188 64 193 52 196 39" fill="none" stroke="#ff1e3c" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>

