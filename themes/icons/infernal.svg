      <stop offset="48%" stop-color="#5c0014" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#060002" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armorBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22020a"/>
      <stop offset="55%" stop-color="#0e0004"/>
      <stop offset="100%" stop-color="#060002"/>
    </linearGradient>
    <linearGradient id="visageFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a030c"/>
      <stop offset="52%" stop-color="#120106"/>
      <stop offset="100%" stop-color="#080003"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#190107"/>
      <stop offset="58%" stop-color="#3a0311"/>
      <stop offset="86%" stop-color="#ff1e3c"/>
      <stop offset="100%" stop-color="#ff8596"/>
