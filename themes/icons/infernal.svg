<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="tile">
      <rect x="2" y="2" width="252" height="252" rx="56"/>
    </clipPath>
    <radialGradient id="abyssGlow" cx="50%" cy="46%" r="54%">
