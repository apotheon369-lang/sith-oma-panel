      <stop offset="50%" stop-color="#ff8596"/>
      <stop offset="100%" stop-color="#ff1e3c"/>
    </linearGradient>
    <linearGradient id="eyeFire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff1e3c"/>
      <stop offset="50%" stop-color="#ff8596"/>
      <stop offset="100%" stop-color="#fff0f3"/>
    </linearGradient>
