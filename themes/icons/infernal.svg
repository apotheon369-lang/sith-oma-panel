    <path d="M30 256 L43 212 L72 192 L64 166 L94 182 L128 194 L162 182 L192 166 L184 192 L213 212 L226 256" fill="none" stroke="url(#crimsonRim)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M98 186 L128 236 L158 186 L142 246 L128 254 L114 246 Z" fill="#060002" stroke="#ff1e3c" stroke-width="1.6" opacity="0.9"/>
    <path d="M52 218 L86 202 L98 228" fill="none" stroke="#ff8596" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>
    <path d="M204 218 L170 202 L158 228" fill="none" stroke="#ff8596" stroke-width="1.4" opacity="0.55" stroke-linecap="round"/>

