  <rect x="2.5" y="2.5" width="251" height="251" rx="54.5" fill="none" stroke="url(#rimOuter)" stroke-width="3"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="49.5" fill="none" stroke="#ff1e3c" stroke-width="1.3" opacity="0.72"/>
