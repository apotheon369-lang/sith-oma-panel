    <path d="M44 82 L46 87 L51 89 L46 91 L44 96 L42 91 L37 89 L42 87 Z" fill="#ff1e3c" opacity="0.78"/>
    <path d="M212 82 L214 87 L219 89 L214 91 L212 96 L210 91 L205 89 L210 87 Z" fill="#ff8596" opacity="0.78"/>

