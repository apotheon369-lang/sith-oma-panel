    <path d="M90 112 L118 122 L128 115 L138 122 L166 112" fill="none" stroke="#ff8596" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 140 L108 148 L104 162" fill="none" stroke="#ff1e3c" stroke-width="1.6" opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M164 140 L148 148 L152 162" fill="none" stroke="#ff1e3c" stroke-width="1.6" opacity="0.75" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M128 122 L123 142 L128 147 L133 142 Z" fill="#060002" stroke="#ff1e3c" stroke-width="1.4" stroke-linejoin="round"/>

