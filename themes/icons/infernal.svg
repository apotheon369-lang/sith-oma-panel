    <g fill="#ff8596">
      <circle cx="38" cy="54" r="1.4" opacity="0.7"/>
      <circle cx="218" cy="52" r="1.5" opacity="0.75"/>
      <circle cx="32" cy="164" r="1.2" opacity="0.55"/>
      <circle cx="224" cy="160" r="1.2" opacity="0.55"/>
