    <path d="M108 158 L118 154 L128 157 L138 154 L148 158 L142 165 L128 163 L114 165 Z" fill="#060002" stroke="#ff1e3c" stroke-width="1.5" stroke-linejoin="round"/>
    <polygon points="113,157 116,164 119,156" fill="#ff8596"/>
    <polygon points="143,157 140,164 137,156" fill="#ff8596"/>
    <path d="M120 174 L128 178 L136 174" fill="none" stroke="#ff8596" stroke-width="1.6" stroke-linecap="round"/>
