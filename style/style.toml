# The launcher's style.
version = 1
theme = "infernal-amoled"
font = "Oswald"

[home]
recent-apps = false
empty-page-left = false
empty-page-right = false
home-page = 0
columns = 5

[widgets]
gaps-in = 4
gaps-out = 8
opacity = 1.0
frost = false
border-width = 1
border = "#050002"
border-focused = "#ff1e3c"

[screens]
gaps-out = 2
border-width = 1

[keybar]
gaps-out = 4
border-width = 1

[icons]
monochrome = true

[corners]
scale = 0.6

[status-bar]
shown = false
framed = true
background = "#000000"
opacity = 1
border = "#050002"

[navigation-bar]
framed = true
background = "#000000"
opacity = 1
border = "#050002"

[terminal]
text = 10
